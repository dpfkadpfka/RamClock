<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>생각 뽑기</title>
<meta name="description" content="학생들이 QR로 생각을 보내면 캡슐 속에 숨어 있다가, 선생님이 뽑을 때 하나씩 열려요. 만든 사람 예람쌤">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
/* 레이아웃: 선생님 — 왼쪽 큰 캡슐 통(학생 생각이 캡슐로 쌓임) + 아래 뽑기 버튼, 오른쪽 QR·참여 수·뽑은 생각 목록.
   학생 — 질문 카드 + 생각 쓰기 칸 + 보내기. 캡슐 모양은 .cap 하나만 바꾸면 이미지로 교체 가능 */
:root{
  --bg:#f3f1ff; --card:#fff; --ink:#1d1f3a; --mut:#6b6f8f; --line:#e3e1f4;
  --acc:#5b4bff; --acc2:#ff5c8a; --sun:#ffc23d;
  --jar:#eef0ff; --jar-line:#d6d8f6;
  --c1:#ff6b8b; --c2:#ffb03a; --c3:#3ec7a3; --c4:#4fa3ff; --c5:#a77bff; --c6:#ff8f5a;
  --font:"Freesentation","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14152a; --card:#1e2040; --ink:#eef0ff; --mut:#a7abcf; --line:#2f3260; --jar:#191b36; --jar-line:#33366a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.pri{border:0;border-radius:999px;padding:14px 30px;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(95deg,var(--acc),var(--acc2));box-shadow:0 6px 18px rgba(91,75,255,.28);transition:transform .15s,box-shadow .15s}
.pri:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(91,75,255,.35)}
.pri:disabled{opacity:.45;transform:none;cursor:default}
.sec{border:1.5px solid var(--line);border-radius:999px;padding:11px 20px;font-weight:700;font-size:16px;background:var(--card);transition:border-color .15s,transform .15s}
.sec:hover{border-color:var(--acc);transform:translateY(-1px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px}
.brand i{width:26px;height:34px;border-radius:13px;background:linear-gradient(180deg,color-mix(in srgb,var(--c4) 35%,#fff) 0 48%,var(--c4) 48% 100%);display:inline-block;transform:rotate(18deg);box-shadow:0 3px 8px rgba(30,20,90,.18)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:18px 16px 26px}
footer a{color:inherit;text-decoration:none}

/* ---------- 시작 화면 ---------- */
#setup{max-width:640px;margin:0 auto;padding:40px 16px}
#setup .card{background:var(--card);border-radius:28px;padding:32px 28px;box-shadow:0 10px 40px rgba(40,30,120,.08);display:flex;flex-direction:column;gap:18px}
#setup h1{margin:6px 0 0;font-size:34px;font-weight:800;letter-spacing:-.5px}
#setup p{margin:0;color:var(--mut);font-size:17px;line-height:1.6}
label.f{font-weight:700;font-size:16px}
input[type=text],textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:20px;background:var(--card);outline:none;transition:border-color .15s}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-size:14px;padding:7px 14px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;user-select:none}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}

/* ---------- 선생님 화면 ---------- */
#room{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding:18px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));max-width:1500px;margin:0 auto}
.topbar{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
#qtitle{grid-column:1/-1;margin:0;font-size:clamp(26px,3.4vw,44px);font-weight:800;letter-spacing:-.5px;line-height:1.25}
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
#jar{position:relative;min-height:56vh;background:var(--jar);border:3px solid var(--jar-line);border-radius:36px;padding:26px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:16px;overflow:hidden}
#jar.empty::before{content:"학생들이 생각을 보내면 여기에 캡슐로 쌓여요";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:22px;font-weight:700;text-align:center;padding:20px}
#jar.shake{animation:shake .5s ease-in-out 3}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}

/* 캡슐 — 이미지로 바꿀 때는 .cap에 background-image만 넣고 ::before/::after를 지우면 된다 */
.cap{--c:var(--c1);width:64px;height:84px;border-radius:32px;border:0;padding:0;position:relative;flex:0 0 auto;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 32%,#fff) 0 47%,var(--c) 47% 100%);box-shadow:inset 0 -7px 0 rgba(0,0,0,.08),0 6px 14px rgba(30,20,90,.16);
  animation:drop .55s cubic-bezier(.3,1.4,.5,1) both, bob 3.2s ease-in-out infinite;transition:transform .15s}
.cap::before{content:"";position:absolute;left:14px;right:14px;top:20%;height:24%;border-radius:8px 8px 4px 4px;background:#fffdf4;opacity:.85;transform:rotate(-8deg)}
.cap::after{content:"";position:absolute;left:10px;top:9px;width:9px;height:20px;border-radius:6px;background:rgba(255,255,255,.75)}
.cap:hover{transform:scale(1.12) rotate(-6deg)}
.cap.lit{transform:scale(1.22);box-shadow:0 0 0 6px var(--sun),0 10px 24px rgba(30,20,90,.25)}
.cap.done{opacity:.28;filter:grayscale(.6);animation:none}
.cap .nm{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);font-size:12px;font-weight:800;background:var(--card);border-radius:8px;padding:1px 6px;color:var(--mut);white-space:nowrap}
@keyframes drop{0%{transform:translateY(-140px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
.cap:nth-child(6n+2){--c:var(--c2);animation-delay:0s,.4s}.cap:nth-child(6n+3){--c:var(--c3);animation-delay:0s,.8s}
.cap:nth-child(6n+4){--c:var(--c4);animation-delay:0s,1.2s}.cap:nth-child(6n+5){--c:var(--c5);animation-delay:0s,1.6s}.cap:nth-child(6n){--c:var(--c6);animation-delay:0s,2s}

.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ctrl .pri{font-size:24px;padding:16px 40px}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.box{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 6px 24px rgba(40,30,120,.06)}
#qr{background:#fff;border-radius:16px;padding:10px;aspect-ratio:1}
#qr svg{width:100%;height:100%;display:block}
.code{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}
.code b{font-size:30px;letter-spacing:4px;font-weight:800;color:var(--acc)}
.code span{color:var(--mut);font-size:14px}
#cnt{font-size:20px;font-weight:800;margin:0 0 4px}
#live{font-size:13px;color:var(--mut)}
#live.ok::before{content:"● ";color:#2bb673}
#live.bad::before{content:"● ";color:#e5484d}
#picked h3{margin:0 0 10px;font-size:18px}
#plist{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow:auto}
#plist div{background:var(--jar);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
#plist small{display:block;color:var(--mut);font-size:12px}
#plist:empty::before{content:"아직 뽑은 생각이 없어요";color:var(--mut);font-size:14px}

/* 열린 캡슐 */
#open{position:fixed;inset:0;background:rgba(20,18,50,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#open .wrap{position:relative;width:min(900px,100%);display:flex;flex-direction:column;align-items:center}
.halves{position:relative;width:150px;height:150px;margin-bottom:-40px;z-index:2}
.halves .t,.halves .b{position:absolute;left:0;width:150px;height:75px}
.halves .t{top:0;border-radius:75px 75px 0 0;background:color-mix(in srgb,var(--oc,var(--c1)) 32%,#fff);animation:lid .6s .1s cubic-bezier(.3,1.3,.5,1) both}
.halves .b{bottom:0;border-radius:0 0 75px 75px;background:var(--oc,var(--c1));animation:base .6s .1s ease both}
@keyframes lid{to{transform:translate(-120px,-60px) rotate(-35deg)}}
@keyframes base{to{transform:translate(120px,40px) rotate(25deg);opacity:0}}
.paper{background:#fffdf4;color:#2a2440;border-radius:26px;padding:40px 44px 30px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.28);animation:unfold .55s .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes unfold{0%{transform:scaleY(.05) translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.paper .tag{display:inline-block;background:linear-gradient(95deg,var(--sun),#ff8f5a);color:#fff;font-weight:800;border-radius:999px;padding:6px 18px;font-size:17px}
.paper .txt{font-size:clamp(30px,5vw,58px);font-weight:800;line-height:1.35;margin:22px 0 10px;word-break:keep-all;overflow-wrap:anywhere}
.paper .who{color:#8a83a8;font-size:20px;font-weight:700;min-height:1em}
.paper .btns{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.paper .sec{background:#fff;color:#2a2440}

/* ---------- 학생 화면 ---------- */
#stu{max-width:620px;margin:0 auto;padding:28px 16px}
#stu .q{background:var(--card);border-radius:26px;padding:24px;box-shadow:0 10px 30px rgba(40,30,120,.08)}
#stu .q small{color:var(--mut);font-weight:700}
#stu .q h1{margin:8px 0 0;font-size:clamp(24px,6vw,34px);line-height:1.35;font-weight:800}
#stu form{display:flex;flex-direction:column;gap:12px;margin-top:18px}
#stu textarea{min-height:130px;resize:vertical;font-size:22px;line-height:1.5}
#stu .len{text-align:right;color:var(--mut);font-size:13px;margin-top:-6px}
#sent{text-align:center;padding:30px 10px}
#sent .cap{width:84px;height:110px;margin:0 auto 20px;animation:fly 1.2s ease-in both}
@keyframes fly{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.1);opacity:1}70%{transform:none}100%{transform:translateY(-30px)}}
#sent h2{margin:0 0 8px;font-size:30px}
#sent p{color:var(--mut);margin:0 0 20px;font-size:18px}
.err{color:#d64545;font-weight:700;font-size:15px;min-height:1.2em}

@media (max-width:900px){
  #room{grid-template-columns:1fr}
  #jar{min-height:42vh}
  .side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  #picked{grid-column:1/-1}
}
@media (max-width:520px){.side{grid-template-columns:1fr}.cap{width:52px;height:68px}}
</style>
</head>
<body>

<!-- 시작 -->
<section id="setup" hidden>
  <div class="card">
    <div class="brand"><i></i>생각 뽑기</div>
    <h1>무엇을 물어볼까요?</h1>
    <p>학생들이 QR을 찍고 생각을 보내면 캡슐 속에 숨어 있어요. 캡슐을 누르거나 [랜덤 뽑기]를 누르면 하나씩 열려요.</p>
    <label class="f" for="q">질문</label>
    <input type="text" id="q" maxlength="60" placeholder="예) 세종대왕께 묻고 싶은 것은?">
    <div class="chips">
      <button class="sec" data-q="오늘 배운 것 중 기억에 남는 것은?">오늘 배운 것</button>
      <button class="sec" data-q="궁금한 점을 써 보세요">궁금한 점</button>
      <button class="sec" data-q="친구에게 하고 싶은 말은?">친구에게 한마디</button>
    </div>
    <label class="toggle"><input type="checkbox" id="askName"> 학생 이름(번호)도 받기</label>
    <button class="pri" id="start">QR 띄우고 시작하기</button>
  </div>
</section>

<!-- 선생님 -->
<section id="room" hidden>
  <div class="topbar">
    <div class="brand"><i></i>생각 뽑기</div>
    <div class="ctrl"><button class="sec" id="newQ">새 질문</button></div>
  </div>
  <h2 id="qtitle"></h2>
  <div class="main">
    <div id="jar" class="empty" aria-label="학생 생각 캡슐"></div>
    <div class="ctrl">
      <button class="pri" id="draw" disabled>랜덤 뽑기</button>
      <button class="sec" id="lock">그만 받기</button>
      <button class="sec" id="reset">모두 닫기</button>
    </div>
  </div>
  <aside class="side">
    <div class="box">
      <div id="qr"></div>
      <div class="code"><span>QR을 찍어요</span><b id="code"></b></div>
    </div>
    <div class="box"><p id="cnt">0개의 생각</p><div id="live">연결하는 중…</div></div>
    <div class="box" id="picked"><h3>뽑은 생각</h3><div id="plist"></div></div>
  </aside>
</section>

<div id="open" hidden>
  <div class="wrap">
    <div class="halves"><div class="t"></div><div class="b"></div></div>
    <div class="paper">
      <span class="tag">★ 뽑힌 생각 ★</span>
      <div class="txt" id="otxt"></div>
      <div class="who" id="owho"></div>
      <div class="btns"><button class="pri" id="again">한 번 더 뽑기</button><button class="sec" id="oclose">닫기</button></div>
    </div>
  </div>
</div>

<!-- 학생 -->
<section id="stu" hidden>
  <div class="brand" style="margin:0 0 16px"><i></i>생각 뽑기</div>
  <div class="q"><small>선생님의 질문</small><h1 id="sq"></h1></div>
  <form id="sform">
    <input type="text" id="sname" maxlength="12" placeholder="번호와 이름 (예: 3번 김하늘)" hidden>
    <textarea id="stxt" maxlength="80" placeholder="내 생각을 써요"></textarea>
    <div class="len"><span id="slen">0</span>/80</div>
    <div class="err" id="serr"></div>
    <button class="pri" id="ssend" type="submit">보내기</button>
  </form>
  <div id="sent" hidden>
    <div class="cap"></div>
    <h2>캡슐에 쏙! 보냈어요</h2>
    <p>선생님이 뽑으면 화면에 나와요.</p>
    <button class="sec" id="more">생각 하나 더 보내기</button>
  </div>
</section>

<footer>© 2026 예람쌤. All rights reserved. · 문의 <a href="mailto:dpfkadpfka@gmail.com">dpfkadpfka@gmail.com</a></footer>

<script src="qrcode.js"></script>
<script>
(function(){
var SERVER='https://ntfy.sh', PREFIX='saenggak-ppobgi-';
var $=function(i){return document.getElementById(i);};
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem('sgp_'+k)); localStorage.setItem('sgp_'+k,JSON.stringify(v)); }catch(e){ return null; }}
function rid(n){var cs='abcdefghjkmnpqrstuvwxyz23456789',s='';var a=new Uint32Array(n);crypto.getRandomValues(a);for(var i=0;i<n;i++)s+=cs[a[i]%cs.length];return s;}
var P=new URLSearchParams(location.search);

/* ================= 학생 ================= */
if(P.get('r')){
  var room=P.get('r'), dev=store('dev')||rid(10); store('dev',dev);
  $('stu').hidden=false; $('sq').textContent=P.get('q')||'선생님의 질문에 답해요';
  if(P.get('n')==='1') $('sname').hidden=false;
  var nm=store('name'); if(nm) $('sname').value=nm;
  $('stxt').oninput=function(){ $('slen').textContent=this.value.length; };
  $('sform').onsubmit=function(e){
    e.preventDefault(); var t=$('stxt').value.trim(), n=$('sname').hidden?'':$('sname').value.trim();
    if(!t){ $('serr').textContent='생각을 먼저 써 주세요.'; return; }
    if(!$('sname').hidden && !n){ $('serr').textContent='번호와 이름을 써 주세요.'; return; }
    $('serr').textContent=''; $('ssend').disabled=true; $('ssend').textContent='보내는 중…'; if(n) store('name',n);
    fetch(SERVER+'/'+PREFIX+room,{method:'POST',body:JSON.stringify({k:'a',id:rid(8),dev:dev,t:t,n:n})})
      .then(function(r){ if(!r.ok) throw 0; $('sform').hidden=true; $('sent').hidden=false; $('stxt').value=''; $('slen').textContent='0'; })
      .catch(function(){ $('serr').textContent='보내지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.'; })
      .then(function(){ $('ssend').disabled=false; $('ssend').textContent='보내기'; });
  };
  $('more').onclick=function(){ $('sent').hidden=true; $('sform').hidden=false; $('stxt').focus(); };
  return;
}

/* ================= 선생님 ================= */
var st=store('room'); // {code,q,askName,since,opened:{},locked}
var items=[], seen={}, es=null, rolling=false;

function showSetup(){ $('setup').hidden=false; $('room').hidden=true; $('q').focus(); }
document.querySelectorAll('[data-q]').forEach(function(b){ b.onclick=function(){ $('q').value=b.dataset.q; $('q').focus(); }; });
$('start').onclick=function(){
  var q=$('q').value.trim(); if(!q){ $('q').focus(); return; }
  st={code:rid(6),q:q,askName:$('askName').checked,since:Math.floor(Date.now()/1000)-5,opened:{},locked:false};
  store('room',st); openRoom();
};
$('newQ').onclick=function(){ if(items.length && !confirm('새 질문을 시작할까요? 지금 캡슐은 사라져요.')) return; if(es) es.close(); st=null; store('room',null); location.reload(); };

function link(){ var u=new URL(location.href.split('?')[0]); u.searchParams.set('r',st.code); u.searchParams.set('q',st.q); if(st.askName) u.searchParams.set('n','1'); return u.toString(); }

function openRoom(){
  $('setup').hidden=true; $('room').hidden=false; $('qtitle').textContent=st.q; $('code').textContent=st.code.toUpperCase();
  var c=qrcode(0,'M'); c.addData(link(),'Byte'); c.make(); $('qr').innerHTML=c.createSvgTag({cellSize:8,margin:1,scalable:true});
  $('lock').textContent=st.locked?'다시 받기':'그만 받기';
  items=[]; seen={}; $('jar').innerHTML=''; $('plist').innerHTML='';
  // 지난 것 먼저(새로고침해도 그대로), 그다음 실시간
  fetch(SERVER+'/'+PREFIX+st.code+'/json?poll=1&since='+st.since).then(function(r){return r.text();}).then(function(tx){
    tx.split('\n').forEach(function(l){ if(l.trim()) take(l, true); }); render(); listen();
  }).catch(function(){ listen(); });
}
function take(line, quiet){
  try{
    var m=JSON.parse(line); if(m.event && m.event!=='message') return;
    var a=JSON.parse(m.message||'{}'); if(a.k!=='a'||!a.id||seen[a.id]) return;
    if(st.locked && !quiet) return;
    seen[a.id]=1; items.push({id:a.id,t:String(a.t||'').slice(0,80),n:String(a.n||'').slice(0,12)});
    if(!quiet) render();
  }catch(e){}
}
function listen(){
  if(es) es.close();
  es=new EventSource(SERVER+'/'+PREFIX+st.code+'/sse?since='+Math.floor(Date.now()/1000));
  es.onopen=function(){ $('live').textContent='학생 생각을 받고 있어요'; $('live').className='ok'; };
  es.onmessage=function(e){ take(e.data,false); };
  es.onerror=function(){ $('live').textContent='다시 연결하는 중…'; $('live').className='bad'; };
}
function render(){
  var jar=$('jar'); jar.classList.toggle('empty',!items.length);
  for(var i=jar.children.length;i<items.length;i++){
    var it=items[i], b=document.createElement('button'); b.className='cap'; b.dataset.id=it.id; b.title='눌러서 열기';
    b.setAttribute('aria-label',(i+1)+'번째 캡슐');
    b.onclick=(function(id){return function(){ if(!rolling) reveal(id); };})(it.id);
    jar.appendChild(b);
  }
  [].forEach.call(jar.children,function(b){ b.classList.toggle('done',!!st.opened[b.dataset.id]); });
  var left=items.filter(function(x){return !st.opened[x.id];}).length;
  $('cnt').textContent=items.length+'개의 생각'+(items.length?' · 남은 캡슐 '+left+'개':'');
  $('draw').disabled=!left;
  var pl=$('plist'); pl.innerHTML='';
  items.filter(function(x){return st.opened[x.id];}).sort(function(a,b){return st.opened[b.id]-st.opened[a.id];}).forEach(function(x){
    var d=document.createElement('div'); d.textContent=x.t; if(x.n){var s=document.createElement('small'); s.textContent=x.n; d.appendChild(s);} pl.appendChild(d);
  });
}
function reveal(id){
  var it=items.find(function(x){return x.id===id;}); if(!it) return;
  var cap=document.querySelector('.cap[data-id="'+id+'"]');
  $('open').style.setProperty('--oc', cap?getComputedStyle(cap).getPropertyValue('--c'):'');
  $('otxt').textContent=it.t; $('owho').textContent=st.askName?it.n:'';
  var o=$('open'); o.hidden=true; void o.offsetWidth; o.hidden=false;   // 애니메이션 다시 시작
  st.opened[id]=Date.now(); store('room',st); render();
  $('again').disabled=!items.some(function(x){return !st.opened[x.id];});
}
function draw(){
  if(rolling) return; var pool=items.filter(function(x){return !st.opened[x.id];}); if(!pool.length) return;
  rolling=true; $('open').hidden=true; var jar=$('jar'); jar.classList.add('shake');
  var caps=pool.map(function(x){return document.querySelector('.cap[data-id="'+x.id+'"]');});
  var win=Math.floor(Math.random()*pool.length), steps=12+Math.floor(Math.random()*6), i=0, cur=null;
  (function tick(){
    if(cur) cur.classList.remove('lit');
    cur=caps[i<steps?Math.floor(Math.random()*caps.length):win]; cur.classList.add('lit');
    if(i++<steps){ setTimeout(tick,80+i*i*2.2); return; }
    setTimeout(function(){ cur.classList.remove('lit'); jar.classList.remove('shake'); rolling=false; reveal(pool[win].id); },500);
  })();
}
$('draw').onclick=draw; $('again').onclick=draw; $('oclose').onclick=function(){ $('open').hidden=true; };
$('open').onclick=function(e){ if(e.target===this) this.hidden=true; };
$('lock').onclick=function(){ st.locked=!st.locked; store('room',st); this.textContent=st.locked?'다시 받기':'그만 받기'; $('live').textContent=st.locked?'지금은 생각을 받지 않아요':'학생 생각을 받고 있어요'; };
$('reset').onclick=function(){ if(!confirm('연 캡슐을 모두 다시 닫을까요?')) return; st.opened={}; store('room',st); render(); };
document.addEventListener('keydown',function(e){ if(e.key==='Escape') $('open').hidden=true; if(e.key===' '&&!$('room').hidden&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); draw(); } });

if(st&&st.code) openRoom(); else showSetup();
})();
</script>

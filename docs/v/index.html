<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>투표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Freesentation/Freesentation.css">
<style>
:root{--bg:#f2f4ff;--card:#fff;--ink:#1c223a;--mut:#6a7290;--line:#dfe3f3;--acc:#4c63ff;--acc2:#a05cff;--ok:#1f9d6b;--bad:#d64545}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Freesentation","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left)) 40px max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:16px}
.q{font-size:30px;font-weight:700;text-align:center;line-height:1.3;margin:6px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.opt{min-height:70px;border-radius:18px;border:2px solid var(--line);background:#fff;font:inherit;font-size:24px;font-weight:700;color:var(--ink);cursor:pointer;padding:10px 18px;text-align:left}
.opt.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}
textarea{width:100%;min-height:140px;border-radius:16px;border:1px solid var(--line);padding:14px;font:inherit;font-size:22px;resize:vertical}
.btn{height:60px;border:0;border-radius:30px;font:inherit;font-size:22px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.btn:disabled{opacity:.45}
.msg{text-align:center;font-size:20px;min-height:26px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="q" id="q">투표</div>
  <div class="box" id="choice" hidden></div>
  <div class="box" id="text" hidden>
    <textarea id="ta" maxlength="80" placeholder="내 생각을 짧게 써요"></textarea>
    <button class="btn" id="send">보내기</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="box" id="err" hidden><div class="q" style="font-size:22px">선생님이 띄워 준 QR로 다시 들어와 주세요.</div></div>
</div>
<script>
(function(){
  var p = new URLSearchParams(location.search), $ = function(i){ return document.getElementById(i); };
  var code = (p.get('c')||'').replace(/[^a-z0-9]/g,''), id = (p.get('id')||'').replace(/[^a-z0-9]/g,''), q = p.get('q')||'', mode = p.get('m')||'c';
  var opts = (p.get('o')||'').split('|').filter(function(x){ return x.trim().length; });
  if (code.length < 8 || !id) { $('err').hidden = false; $('q').hidden = true; return; }
  $('q').textContent = q || '투표'; document.title = q || '투표';
  var dev; try { dev = localStorage.getItem('rc-dev'); if (!dev) { dev = Math.random().toString(36).slice(2,12); localStorage.setItem('rc-dev', dev); } } catch(e) { dev = Math.random().toString(36).slice(2,12); }
  function send(body, done){
    $('msg').className = 'msg'; $('msg').textContent = '보내는 중…';
    fetch('https://ntfy.sh/ramclock-' + code + '-vote', { method: 'POST', body: JSON.stringify(body) })
      .then(function(r){ if (!r.ok) throw 0; $('msg').className = 'msg ok'; $('msg').textContent = '보냈어요! 바꾸고 싶으면 다시 골라도 돼요.'; if (done) done(); })
      .catch(function(){ $('msg').className = 'msg bad'; $('msg').textContent = '보내지 못했어요. 다시 눌러 주세요.'; });
  }
  if (mode === 't') {
    $('text').hidden = false;
    $('send').onclick = function(){ var t = $('ta').value.trim(); if (!t) return; send({ id: id, dev: dev, text: t }); };
  } else {
    $('choice').hidden = false;
    opts.forEach(function(o, i){
      var b = document.createElement('button'); b.className = 'opt'; b.textContent = (i + 1) + '. ' + o;
      b.onclick = function(){ [].forEach.call($('choice').children, function(x){ x.classList.remove('on'); }); b.classList.add('on'); send({ id: id, dev: dev, opt: i }); };
      $('choice').appendChild(b);
    });
  }
})();
</script>
</body>
</html>

# main에 올라온 코드의 버전(src/Updater.cs의 Version)으로 릴리스가 아직 없으면
# RamClock.exe를 만들어 깃허브 릴리스(vX.Y.Z)에 올린다. 설치된 RamClock은 이걸 보고 자동 업데이트한다.
name: RamClock 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 확인
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(grep -oP 'public const string Version = "\K[^"]+' src/Updater.cs)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
      - name: 빌드 (mono 도커 이미지 — 설치 서버가 멈춰도 상관없게)
        if: steps.ver.outputs.new == 'yes'
        run: |
          for i in 1 2 3; do
            if docker run --rm -v "$PWD:/w" -w /w mono:6.12 bash ./build.sh; then exit 0; fi
            echo "다시 시도 $i"; sleep 10
          done
          exit 1
      - name: 릴리스에 올리기
        if: steps.ver.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ steps.ver.outputs.v }}"
          gh release create "$V" RamClock.exe --target "$GITHUB_SHA" --title "RamClock $V" --notes "RamClock $V — 받아서 실행하면 돼요. 이미 쓰고 있다면 자동으로 업데이트돼요."

# v로 시작하는 태그(예: v1.0.1)를 올리면 RamClock.exe를 만들어 깃허브 릴리스에 올린다.
# 설치된 RamClock은 새 릴리스를 보고 알아서 업데이트한다.
name: RamClock 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mono 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q mono-devel
      - name: 빌드
        run: |
          V="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || V=""
          ./build.sh "$V"
      - name: 릴리스에 올리기
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "RamClock $GITHUB_REF_NAME" --notes "RamClock $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" RamClock.exe --clobber
